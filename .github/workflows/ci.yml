name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Check lockfile
        run: uv lock --check

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run linting
        run: uv run ruff check .

      - name: Run type checking
        run: uv run mypy

      - name: Scan tracked release files for secrets and portability failures
        run: uv run python -m runtasks.release_checks

      - name: Run unit and external-boundary contract tests
        run: >-
          uv run python -m unittest -v
          tests.test_execution_contracts
          tests.test_pi_mcp_release_adapters
          tests.test_pi_mcp_release_check
          tests.test_redaction
          tests.test_telegram_config
          tests.test_telegram_integration
          tests.test_telegram_lock

      - name: Run CLI subprocess and behavior tests
        run: >-
          uv run python -m unittest -v
          tests.test_backup_restore_cli
          tests.test_cli
          tests.test_decisions_cli
          tests.test_installation_cli
          tests.test_pi_mcp_handler_cli
          tests.test_pi_mcp_update_execution
          tests.test_runs_cli
          tests.test_runtasks_skill
          tests.test_scheduler_cli
          tests.test_tasks_cli
          tests.test_telegram_cli
          tests.test_telegram_decisions

      - name: Run public-release capability checks
        run: uv run python -m unittest -v tests.test_release_checks

      - name: Run safe end-to-end update and rollback suite
        run: uv run python -m unittest -v tests.test_end_to_end_release

      - name: Check pull request diff
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"

      - name: Check pushed diff
        if: github.event_name == 'push'
        run: git diff --check "${{ github.event.before }}...${{ github.sha }}"
